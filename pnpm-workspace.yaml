packages:
  - "packages/*"

allowBuilds:
  '@google/genai': true
  esbuild: true
  koffi: true
  protobufjs: true

# 统一管理 pi 各包版本，升级只改这里
catalog:
  '@earendil-works/pi-agent-core': latest
  '@earendil-works/pi-ai': latest
  '@earendil-works/pi-coding-agent': latest
  '@earendil-works/pi-tui': latest

# photon-node (tool-opt) 依赖 koffi 需要构建脚本
onlyBuiltDependencies:
  - esbuild
  - koffi

# pi 包跟随 latest，发布当天即安装；其余依赖仍保留 24h 供应链检查
minimumReleaseAgeExclude:
  - '@earendil-works/*'
